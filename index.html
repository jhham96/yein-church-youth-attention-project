<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>출석 체크</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 50px 20px; }
    input { padding: 10px; font-size: 16px; margin-bottom: 15px; width: 80%; max-width: 300px; }
    button { padding: 10px 20px; font-size: 16px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; }
    #message { margin-top: 20px; font-weight: bold; color: #333; line-height: 1.5; white-space: pre-line; }
  </style>
  
  <script src="config.js"></script>
</head>
<body>
  <h2>출석 체크</h2>
  
  <div id="formSection">
    <input type="text" id="nameInput" placeholder="이름을 입력하세요">
    <br>
    <button onclick="checkLocationAndSubmit()" id="submitBtn">출석</button>
  </div>
  
  <div id="message"></div>

  <script>
    const deviceInfo = navigator.userAgent; // 브라우저 및 기기 종류

    // 💡 브라우저 지문(Fingerprint) 생성 함수 (시크릿 모드 우회 방지용)
    async function generateDeviceFingerprint() {
      const canvas = document.createElement('canvas');
      const gl = canvas.getContext('webgl');
      const renderer = gl ? gl.getParameter(gl.RENDERER) : ''; 
      
      const rawData = navigator.userAgent + 
                      screen.width + 'x' + screen.height + 
                      navigator.language + 
                      navigator.hardwareConcurrency +
                      renderer;

      const msgBuffer = new TextEncoder().encode(rawData);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      
      return 'FP_' + hashHex.substring(0, 15);
    }

    // 페이지 로드 시 이름 자동 완성
    window.onload = function() {
      const savedName = localStorage.getItem('myAttendanceName');
      if (savedName) {
        document.getElementById('nameInput').value = savedName;
      }
    };

    // 두 좌표 간의 거리를 미터(m) 단위로 계산하는 함수 (하버사인 공식)
    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const p1 = lat1 * Math.PI/180;
      const p2 = lat2 * Math.PI/180;
      const dp = (lat2-lat1) * Math.PI/180;
      const dl = (lon2-lon1) * Math.PI/180;
      const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    // 출석 버튼 클릭 시 실행
    async function checkLocationAndSubmit() {
      const name = document.getElementById('nameInput').value.trim();
      
      if (!name) {
        alert("이름을 입력해주세요.");
        return;
      }

      document.getElementById('message').innerText = "위치 및 기기 정보를 확인 중입니다...\n(GPS 권한을 허용해주세요)";
      document.getElementById('message').style.color = "#333";
      document.getElementById('submitBtn').disabled = true;

      // 고유 기기 지문 실시간 생성
      const deviceId = await generateDeviceFingerprint();

      // GPS 위치 확인
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function(position) {
            const currentLat = position.coords.latitude;
            const currentLon = position.coords.longitude;
            
            // config.js 파일의 CONFIG 객체에서 목표 좌표와 거리를 가져옴
            const distance = getDistance(currentLat, currentLon, CONFIG.TARGET_LAT, CONFIG.TARGET_LON);

            if (distance <= CONFIG.MAX_DISTANCE) {
              document.getElementById('message').innerText = "확인 완료! 기록 중입니다...";
              sendAttendanceToServer(name, deviceId);
            } else {
              document.getElementById('message').innerText = `모임 장소에서 너무 멉니다.\n(현재 거리: 약 ${Math.round(distance)}m / 허용 반경: ${CONFIG.MAX_DISTANCE}m)`;
              document.getElementById('message').style.color = "#f44336";
              document.getElementById('submitBtn').disabled = false;
            }
          },
          function(error) {
            document.getElementById('message').innerText = "위치 권한을 허용해주세요.\n스마트폰의 GPS를 켜고 브라우저 설정에서 위치를 허용해야 합니다.";
            document.getElementById('message').style.color = "#f44336";
            document.getElementById('submitBtn').disabled = false;
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      } else {
        document.getElementById('message').innerText = "이 브라우저에서는 위치 기능을 지원하지 않습니다.";
        document.getElementById('message').style.color = "#f44336";
        document.getElementById('submitBtn').disabled = false;
      }
    }

    // 서버로 데이터 전송
    function sendAttendanceToServer(name, deviceId) {
      localStorage.setItem('myAttendanceName', name);

      // config.js 파일의 CONFIG.SCRIPT_URL을 사용
      const urlParams = `?name=${encodeURIComponent(name)}&deviceId=${encodeURIComponent(deviceId)}&deviceInfo=${encodeURIComponent(deviceInfo)}`;
      
      fetch(CONFIG.SCRIPT_URL + urlParams)
        .then(response => response.json())
        .then(data => {
          document.getElementById('formSection').style.display = 'none';
          if(data.status === "success") {
            document.getElementById('message').innerText = name + "님, 출석이 완료되었습니다!";
            document.getElementById('message').style.color = "#4CAF50";
          } else if(data.status === "duplicate") {
            document.getElementById('message').innerText = name + "님, 오늘은 이미 출석하셨습니다.";
            document.getElementById('message').style.color = "#ff9800";
          } else if(data.status === "proxy") {
            document.getElementById('message').innerText = "해당 기기로는 이미 다른 사람의 출석이 완료되었습니다.\n(대리출석 방지)";
            document.getElementById('message').style.color = "#f44336";
          } else {
            throw new Error(data.message);
          }
        })
        .catch(error => {
          document.getElementById('message').innerText = "오류가 발생했습니다: " + error.message;
          document.getElementById('message').style.color = "#f44336";
          document.getElementById('submitBtn').disabled = false;
        });
    }
  </script>
</body>
</html>
