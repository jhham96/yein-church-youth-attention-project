<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>출석 체크</title>
  <script src="config.js"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 50px 20px;
      margin: 0;
    }

    input {
      padding: 10px;
      font-size: 16px;
      margin-bottom: 15px;
      width: 80%;
      max-width: 300px;
      box-sizing: border-box;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn-submit {
      background-color: #4CAF50;
      color: white;
      width: 80%;
      max-width: 300px;
    }

    .btn-submit:disabled {
      background-color: #9E9E9E;
      cursor: not-allowed;
    }

    #message {
      margin-top: 20px;
      font-weight: bold;
      color: #333;
      line-height: 1.5;
      white-space: pre-line;
    }

    /* 출석 확인 모달 */
    #modalOverlay {
      visibility: hidden;
      opacity: 0;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    #modalOverlay.show {
      visibility: visible;
      opacity: 1;
    }

    #confirmBox {
      background: white;
      padding: 30px 20px;
      border-radius: 12px;
      width: 80%;
      max-width: 300px;
      transform: translateY(-20px) scale(0.95);
      transition: transform 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    #modalOverlay.show #confirmBox {
      transform: translateY(0) scale(1);
    }

    .btn-group {
      margin-top: 25px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn-cancel {
      background-color: #e0e0e0;
      color: #333;
      flex: 1;
    }

    .btn-confirm {
      background-color: #2196F3;
      color: white;
      flex: 1;
    }

    /* 로딩바 */
    #loadingWrap {
      display: none;
      margin-top: 20px;
      text-align: center;
    }

    #loadingWrap.active {
      display: block;
    }

    #loadingMainText {
      font-size: 15px;
      font-weight: bold;
      color: #333;
      margin-bottom: 4px;
    }

    #loadingSubText {
      font-size: 13px;
      color: #888;
      margin-bottom: 20px;
    }

    #loadingBarWrap {
      width: 80%;
      max-width: 300px;
      margin: 12px auto 0;
    }

    #loadingBarLabel {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #888;
      margin-bottom: 5px;
    }

    #loadingBarTrack {
      background: #e0e0e0;
      border-radius: 999px;
      height: 8px;
      overflow: hidden;
    }

    #loadingBarFill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: #4CAF50;
      transition: width 0.6s ease;
    }
  </style>
</head>

<body>
  <h2>출석 체크</h2>

  <p style="text-align:right; margin: -10px 10% 10px 0;">
    <button onclick="openPatchModal()"
      style="background:none; border:none; color:#999; font-size:13px; cursor:pointer; text-decoration:underline;">
      📋 패치노트
    </button>
  </p>

  <p id="locationDisplay" style="color: #666; font-size: 14px; margin-bottom: 20px;"></p>

  <!-- 위치 권한 거부 배너 -->
  <div id="permissionBanner" style="
    display:none; margin: 0 auto 20px; width:80%; max-width:320px;
    background:#fff3e0; border-radius:10px; padding:14px 16px;
    font-size:14px; color:#555; text-align:left; line-height:1.9;">
    ⚠️ <strong>위치 권한이 차단되어 있습니다.</strong><br>
    출석 버튼을 사용하려면 아래 방법으로 권한을 허용해주세요.<br><br>
    <b>📱 아이폰</b><br>
    설정 → 사파리 → 위치 → <strong>허용</strong> 선택<br><br>
    <b>🤖 안드로이드</b><br>
    주소창 왼쪽 🔒 아이콘 탭 → 위치 → <strong>허용</strong> 선택<br><br>
    변경 후 페이지를 <strong>새로고침</strong>해주세요.
    <div style="text-align:center; margin-top:12px;">
      <button onclick="location.reload()" style="
        background:#ff9800; color:white; border:none; border-radius:6px;
        padding:8px 22px; font-size:14px; cursor:pointer;">
        🔄 새로고침
      </button>
    </div>
  </div>

  <div id="formSection">
    <input type="text" id="nameInput" placeholder="이름을 입력하세요">
    <br>
    <input type="tel" id="phoneSuffixInput" placeholder="휴대폰 뒤 4자리를 입력하세요" inputmode="numeric" maxlength="4"
      pattern="[0-9]{4}">
    <br>
    <button class="btn-submit" onclick="showConfirmModal()" id="mainSubmitBtn">출석</button>
  </div>

  <div id="message"></div>

  <!-- 로딩 영역 -->
  <div id="loadingWrap">
    <div id="loadingMainText">위치 확인 중...</div>
    <div id="loadingSubText">잠시만 기다려주세요</div>

    <!-- 원형 스피너 -->
    <svg width="72" height="72" viewBox="0 0 72 72" style="display:block; margin: 0 auto 16px;">
      <circle cx="36" cy="36" r="28" fill="none" stroke="#e0e0e0" stroke-width="6" />
      <circle id="spinnerArc" cx="36" cy="36" r="28" fill="none" stroke="#4CAF50" stroke-width="6"
        stroke-dasharray="175.9" stroke-dashoffset="175.9" stroke-linecap="round" transform="rotate(-90 36 36)"
        style="transition: stroke-dashoffset 0.6s ease, stroke 0.3s ease;" />
      <text id="spinnerPct" x="36" y="41" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">0%</text>
    </svg>

    <!-- 바 형태 진행바 -->
    <div id="loadingBarWrap">
      <div id="loadingBarLabel">
        <span id="loadingBarText">시작 중...</span>
        <span id="loadingBarPct">0%</span>
      </div>
      <div id="loadingBarTrack">
        <div id="loadingBarFill"></div>
      </div>
    </div>
  </div>

  <!-- 출석 확인 모달 -->
  <div id="modalOverlay">
    <div id="confirmBox">
      <h3 style="margin-top:0; color:#333;">이름 확인</h3>
      <p id="confirmMessage" style="font-size: 17px; color:#555; margin-bottom: 5px;"></p>
      <div class="btn-group">
        <button class="btn-cancel" onclick="closeModal()">다시 입력</button>
        <button class="btn-confirm" onclick="proceedAttendance()">네, 맞습니다</button>
      </div>
    </div>
  </div>

  <!-- 패치노트 모달 -->
  <div id="patchModalOverlay" style="
    visibility:hidden; opacity:0;
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.5); z-index:2000;
    display:flex; align-items:center; justify-content:center;
    transition: opacity 0.3s ease, visibility 0.3s ease;">
    <div id="patchModalBox" style="
      background:white; border-radius:12px; width:85%; max-width:340px;
      max-height:70vh; overflow-y:auto; padding:25px 20px;
      box-shadow:0 4px 15px rgba(0,0,0,0.2);
      transform:translateY(-20px) scale(0.95); transition:transform 0.3s ease;">
      <h3 style="margin-top:0; color:#333;">📋 패치노트</h3>
      <div id="patchNoteContent"></div>
      <div style="text-align:center; margin-top:20px;">
        <button onclick="closePatchModal()" style="
          background:#e0e0e0; color:#333; border:none; border-radius:5px;
          padding:10px 30px; font-size:15px; cursor:pointer;">닫기</button>
      </div>
    </div>
  </div>

  <script>
    const deviceInfo = navigator.userAgent;

    // ──────────────────────────────────────────
    // 초기화
    // ──────────────────────────────────────────
    window.onload = function () {
      if (typeof CONFIG !== 'undefined' && typeof TARGET_PLACE !== 'undefined') {
        document.getElementById('locationDisplay').innerText =
          `📍 출석 위치: ${TARGET_PLACE} (반경 ${CONFIG.MAX_DISTANCE}m)`;
      }
      const savedName = localStorage.getItem('myAttendanceName');
      if (savedName) {
        document.getElementById('nameInput').value = savedName;
      }

      const savedPhoneSuffix = localStorage.getItem('myPhoneSuffix');
      if (savedPhoneSuffix) {
        document.getElementById('phoneSuffixInput').value = savedPhoneSuffix;
      }

      // Permissions API로 위치 권한 상태 사전 감지
      if (navigator.permissions) {
        navigator.permissions.query({ name: 'geolocation' }).then(result => {
          if (result.state === 'denied') {
            showPermissionDeniedBanner();
          }
          // 설정에서 권한 변경 시 자동 반영
          result.onchange = () => {
            if (result.state === 'denied') {
              showPermissionDeniedBanner();
            } else {
              hidePermissionDeniedBanner();
            }
          };
        });
      }

      document.getElementById('phoneSuffixInput').addEventListener('input', function (e) {
        e.target.value = sanitizePhoneSuffix(e.target.value);
      });
    };

    function sanitizePhoneSuffix(value) {
      return value.replace(/\D/g, '').slice(0, 4);
    }

    function showPermissionDeniedBanner() {
      document.getElementById('mainSubmitBtn').disabled = true;
      document.getElementById('permissionBanner').style.display = 'block';
    }

    function hidePermissionDeniedBanner() {
      document.getElementById('mainSubmitBtn').disabled = false;
      document.getElementById('permissionBanner').style.display = 'none';
    }

    // ──────────────────────────────────────────
    // 출석 확인 모달
    // ──────────────────────────────────────────
    function showConfirmModal() {
      const name = document.getElementById('nameInput').value.trim();
      const phoneSuffix = sanitizePhoneSuffix(
        document.getElementById('phoneSuffixInput').value.trim()
      );

      document.getElementById('phoneSuffixInput').value = phoneSuffix;

      if (!name) {
        alert("이름을 입력해주세요.");
        return;
      }

      if (phoneSuffix.length !== 4) {
        alert("휴대폰 뒤 4자리를 정확히 입력해주세요.");
        return;
      }

      document.getElementById('confirmMessage').innerHTML =
        `<strong>${name}</strong> 님으로<br>` +
        `휴대폰 뒤 4자리 <strong>${phoneSuffix}</strong>로<br>` +
        `출석하시겠습니까?`;

      document.getElementById('modalOverlay').classList.add('show');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('show');
    }

    // ──────────────────────────────────────────
    // 출석 처리
    // ──────────────────────────────────────────
    async function proceedAttendance() {
      closeModal();

      const name = document.getElementById('nameInput').value.trim();
      const phoneSuffix = sanitizePhoneSuffix(
        document.getElementById('phoneSuffixInput').value.trim()
      );

      const mainBtn = document.getElementById('mainSubmitBtn');
      const msgBox = document.getElementById('message');

      msgBox.innerHTML = "";
      msgBox.style.color = "#333";
      mainBtn.disabled = true;
      startLoading();

      const deviceId = getOrCreateDeviceId();

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function (position) {
            const currentLat = position.coords.latitude;
            const currentLon = position.coords.longitude;
            const distance = getDistance(currentLat, currentLon, CONFIG.TARGET_LAT, CONFIG.TARGET_LON);

            if (distance <= CONFIG.MAX_DISTANCE) {
              sendAttendanceToServer(name, phoneSuffix, deviceId);
            } else {
              finishLoading(false);
              msgBox.innerHTML = `
                <span style="color:#f44336;">
                  📍 모임 장소에서 너무 멉니다.<br>
                  (현재 거리: 약 ${Math.round(distance)}m / 허용 반경: ${CONFIG.MAX_DISTANCE}m)
                </span>
                <div style="margin-top:15px; background:#fff3e0; border-radius:8px; padding:12px 15px; font-size:14px; color:#555; text-align:left; line-height:2;">
                  <strong>💡 이렇게 해보세요</strong><br>
                  1. 휴대폰을 <strong>8자 모양으로 천천히</strong> 돌린 후 재시도<br>
                  2. 와이파이를 끄고 <strong>모바일 데이터</strong>로 전환 후 재시도<br>
                  3. 위 방법으로도 안 되면 <strong>담당자에게 문의</strong>
                </div>
                <br>
                <button class="btn-submit" onclick="retryGPS()" style="width:auto; padding:10px 25px;">
                  🔄 다시 시도
                </button>`;
            }
          },
          function (error) {
            finishLoading(false);
            var reason = "";
            if (error.code === 1) {
              document.getElementById('message').innerHTML = `
                <span style="color:#f44336;">위치 권한이 거부되어 있습니다.</span>
                <div style="margin-top:15px; background:#fff3e0; border-radius:8px; padding:12px 15px; font-size:14px; color:#555; text-align:left; line-height:2;">
                  <strong>📱 권한 다시 허용하는 방법</strong><br>
                  <b>아이폰</b><br>
                  설정 → 사파리 → 위치 → <strong>허용</strong><br>
                  <b>안드로이드</b><br>
                  주소창 왼쪽 🔒 아이콘 → 위치 → <strong>허용</strong><br><br>
                  변경 후 아래 버튼을 눌러주세요.
                </div>
                <br>
                <button class="btn-submit" onclick="location.reload()" style="width:auto; padding:10px 25px;">
                  🔄 새로고침 후 다시 시도
                </button>`;
              return;
            } else if (error.code === 2) {
              reason = "GPS 신호를 찾을 수 없습니다.\n잠시 후 다시 시도해주세요.";
            } else if (error.code === 3) {
              reason = "위치 확인 시간이 초과되었습니다.\n잠시 후 다시 시도해주세요.";
            }
            document.getElementById('message').innerHTML = `
              <span style="color:#f44336;">${reason}</span><br><br>
              <button class="btn-submit" onclick="retryGPS()" style="width:auto; padding:10px 25px;">
                🔄 다시 시도
              </button>`;
          },
          { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
        );
      } else {
        finishLoading(false);
        msgBox.innerText = "이 브라우저에서는 위치 기능을 지원하지 않습니다.";
        msgBox.style.color = "#f44336";
        mainBtn.disabled = false;
      }
    }

    // ──────────────────────────────────────────
    // GPS 재시도
    // ──────────────────────────────────────────
    function retryGPS() {
      // 로딩바 상태 초기화
      document.getElementById('loadingBarFill').style.background = '#4CAF50';
      document.getElementById('loadingBarFill').style.width = '0%';
      document.getElementById('spinnerArc').style.stroke = '#4CAF50';
      document.getElementById('spinnerArc').style.strokeDashoffset = '175.9';
      document.getElementById('spinnerPct').textContent = '0%';

      document.getElementById('message').innerHTML = "";
      document.getElementById('mainSubmitBtn').disabled = false;
      showConfirmModal();
    }

    // ──────────────────────────────────────────
    // 기기 ID
    // ──────────────────────────────────────────
    function getOrCreateDeviceId() {
      let id = localStorage.getItem('attendanceDeviceId');
      if (!id) {
        id = 'LS_' + crypto.randomUUID();
        localStorage.setItem('attendanceDeviceId', id);
      }
      return id;
    }

    async function getPublicIP() {
      try {
        const res = await fetch("https://api.ipify.org?format=json");
        const data = await res.json();
        return data.ip || "";
      } catch (e) {
        console.warn("IP 조회 실패:", e);
        return "";
      }
    }


    // ──────────────────────────────────────────
    // 거리 계산
    // ──────────────────────────────────────────
    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const p1 = lat1 * Math.PI / 180;
      const p2 = lat2 * Math.PI / 180;
      const dp = (lat2 - lat1) * Math.PI / 180;
      const dl = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dp / 2) * Math.sin(dp / 2) +
        Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) * Math.sin(dl / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // ──────────────────────────────────────────
    // 서버 전송
    // ──────────────────────────────────────────
    async function sendAttendanceToServer(name, phoneSuffix, deviceId) {
      try {
        localStorage.setItem('myAttendanceName', name);
        localStorage.setItem('myPhoneSuffix', phoneSuffix);

        const ipAddress = await getPublicIP();

        const urlParams =
          `?name=${encodeURIComponent(name)}` +
          `&phoneSuffix=${encodeURIComponent(phoneSuffix)}` +
          `&deviceId=${encodeURIComponent(deviceId)}` +
          `&deviceInfo=${encodeURIComponent(deviceInfo)}` +
          `&ipAddress=${encodeURIComponent(ipAddress)}`;

        const response = await fetch(CONFIG.SCRIPT_URL + urlParams);
        const data = await response.json();

        document.getElementById('formSection').style.display = 'none';

        if (data.status === "success") {
          finishLoading(true);

          let successMessage = `${name}님, 출석이 완료되었습니다!`;
          if (data.time) {
            successMessage += `\n출석 시각: ${data.time}`;
          }

          document.getElementById('message').innerText = successMessage;
          document.getElementById('message').style.color = "#4CAF50";

        } else if (data.status === "duplicate") {
          finishLoading(false);
          document.getElementById('message').innerText =
            `${name}님, 오늘은 이미 출석하셨습니다.`;
          document.getElementById('message').style.color = "#ff9800";

        } else if (data.status === "proxy") {
          finishLoading(false);
          document.getElementById('message').innerText =
            "해당 기기로는 이미 다른 사람의 출석이 완료되었습니다.\n(대리출석 방지)";
          document.getElementById('message').style.color = "#f44336";

        } else {
          throw new Error(data.message || "알 수 없는 오류");
        }
      } catch (error) {
        finishLoading(false);
        document.getElementById('message').innerText =
          "오류가 발생했습니다: " + error.message;
        document.getElementById('message').style.color = "#f44336";
        document.getElementById('mainSubmitBtn').disabled = false;
      }
    }

    // ──────────────────────────────────────────
    // 패치노트 모달
    // ──────────────────────────────────────────
    function openPatchModal() {
      const container = document.getElementById('patchNoteContent');
      container.innerHTML = PATCH_NOTES.map(note => `
        <div style="margin-bottom:20px; padding-bottom:20px; border-bottom:1px solid #eee;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <strong style="color:#2196F3;">${note.version}</strong>
            <span style="font-size:12px; color:#999;">${note.date}</span>
          </div>
          <ul style="margin:0; padding-left:18px; color:#555; font-size:14px; line-height:1.8;">
            ${note.changes.map(c => `<li>${c}</li>`).join('')}
          </ul>
        </div>
      `).join('');

      const overlay = document.getElementById('patchModalOverlay');
      overlay.style.visibility = 'visible';
      overlay.style.opacity = '1';
      document.getElementById('patchModalBox').style.transform = 'translateY(0) scale(1)';
    }

    function closePatchModal() {
      const overlay = document.getElementById('patchModalOverlay');
      overlay.style.opacity = '0';
      overlay.style.visibility = 'hidden';
      document.getElementById('patchModalBox').style.transform = 'translateY(-20px) scale(0.95)';
    }

    document.getElementById('patchModalOverlay').addEventListener('click', function (e) {
      if (e.target === this) closePatchModal();
    });

    // ──────────────────────────────────────────
    // 로딩바
    // ──────────────────────────────────────────
    const LOADING_STEPS = [
      { main: "GPS 신호 탐색 중...", sub: "위치 권한을 확인하고 있습니다", pct: 20 },
      { main: "위치 확인 중...", sub: "현재 좌표를 가져오는 중입니다", pct: 45 },
      { main: "거리 계산 중...", sub: "모임 장소와의 거리를 계산합니다", pct: 70 },
      { main: "서버에 기록 중...", sub: "출석 정보를 전송하고 있습니다", pct: 90 },
    ];

    let loadingTimer = null;
    let loadingStep = 0;

    function startLoading() {
      loadingStep = 0;
      document.getElementById('loadingWrap').classList.add('active');
      applyLoadingStep(LOADING_STEPS[0]);

      loadingTimer = setInterval(() => {
        loadingStep++;
        if (loadingStep < LOADING_STEPS.length) {
          applyLoadingStep(LOADING_STEPS[loadingStep]);
        } else {
          clearInterval(loadingTimer);
        }
      }, 2000);
    }

    function applyLoadingStep(step) {
      document.getElementById('loadingMainText').innerText = step.main;
      document.getElementById('loadingSubText').innerText = step.sub;
      document.getElementById('loadingBarText').innerText = step.main;
      document.getElementById('loadingBarPct').innerText = step.pct + '%';
      document.getElementById('loadingBarFill').style.width = step.pct + '%';

      const offset = 175.9 * (1 - step.pct / 100);
      document.getElementById('spinnerArc').style.strokeDashoffset = offset;
      document.getElementById('spinnerPct').textContent = step.pct + '%';
    }

    function finishLoading(success) {
      clearInterval(loadingTimer);

      const color = success ? '#4CAF50' : '#f44336';

      document.getElementById('loadingBarFill').style.width = '100%';
      document.getElementById('loadingBarFill').style.background = color;
      document.getElementById('loadingBarPct').innerText = '100%';
      document.getElementById('spinnerArc').style.stroke = color;
      document.getElementById('spinnerArc').style.strokeDashoffset = 0;
      document.getElementById('spinnerPct').textContent = '100%';
      document.getElementById('loadingMainText').innerText = success ? '완료!' : '실패';
      document.getElementById('loadingSubText').innerText = success ? '출석이 기록되었습니다' : '아래 내용을 확인해주세요';

      setTimeout(() => {
        document.getElementById('loadingWrap').classList.remove('active');
      }, 1000);
    }
  </script>
</body>

</html>
